name: E2E

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1.14.0
        with:
          cluster_name: e2e
      - run: go test -race -count=1 -tags=e2e -timeout=10m ./e2e/...
